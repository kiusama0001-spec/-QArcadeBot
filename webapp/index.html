<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Q-ArcadeBot</title>
<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;background:#000;color:white;font-family:'Courier New',Courier,monospace;overflow:hidden}
header{height:46px;padding:8px 14px;display:flex;justify-content:space-between;font-weight:900;background:#111;border-bottom:2px solid #333;font-size:18px}
main{height:calc(100dvh - 46px);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}
#game-container{width:100%;max-width:960px;aspect-ratio:4/3;max-height:calc(100dvh - 46px);background:#000}
#start-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:15px 30px;background:#c84c0c;color:white;border:none;font-size:20px;font-weight:bold;cursor:pointer;border-radius:8px;z-index:99}
</style>
</head>
<body>
<header><span id="title">Q-Arcade</span><span>🕹️ RETRO</span></header>
<main>
    <button id="start-btn" onclick="startGame()">TOCA PARA JUGAR</button>
    <div id="game-container"></div>
</main>

<script>
const parts = location.pathname.split('/');
const game = parts.at(-1) || 'mario';

const titles = {
    pacman: 'Pac-Man (NES)',
    mario: 'Super Mario Bros. (NES)',
    doom: 'DOOM (SNES)',
    naves: 'Galaga (NES)',
    sunset: 'Sunset Riders (SNES)',
    carros: 'Spy Hunter (NES)',
    circus: 'Circus Charlie (NES)'
};
document.getElementById('title').textContent = titles[game] || 'Q-ARCADE';

function getLocalRomPath(g) {
    const baseUrl = 'https://raw.githubusercontent.com/kiusama0001-spec/-QArcadeBot/main/room/';
    
    const localRoms = {
        mario: baseUrl + 'SuperMarioBros.nes',
        pacman: baseUrl + 'PacMan.nes',
        circus: baseUrl + 'CircusCharlie.nes',
        naves: baseUrl + 'Galaga.nes',
        carros: baseUrl + 'SpyHunter.nes',
        sunset: baseUrl + 'SunsetRiders.sfc',
        doom: baseUrl + 'Doom.sfc'
    };
    return localRoms[g] || localRoms['mario'];
}

function startGame() {
    document.getElementById('start-btn').style.display = 'none';

    const romUrl = getLocalRomPath(game);
    
    window.EJS_player = '#game-container';
    window.EJS_gameUrl = romUrl;
    window.EJS_core = romUrl.endsWith('.sfc') ? 'snes' : 'nes';
    window.EJS_unmuteOnStart = true;
    window.EJS_color = '#c84c0c';
    window.EJS_startOnLoaded = true;
    window.EJS_pathToData = 'https://cdn.emulatorjs.org/stable/data/';

    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(script);
}
</script>
</body>
</html>
