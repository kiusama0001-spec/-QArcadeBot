<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Q-ArcadeBot</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;background:#080808;color:white;font-family:system-ui;overflow:hidden}
header{height:52px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:800}
main{height:calc(100dvh - 52px);display:flex;align-items:center;justify-content:center;padding:8px}
canvas{width:min(100%,960px);aspect-ratio:16/9;background:#111;border-radius:12px;touch-action:none}
.controls{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.controls div{display:flex;gap:8px;pointer-events:auto}
.dpad{display:flex;flex-direction:column;align-items:center;gap:4px}
.dpad-row{display:flex;gap:28px}
button{width:56px;height:56px;border:0;border-radius:50%;background:#292929;color:#fff;font-size:20px}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#000b}#start button{width:auto;padding:0 26px;border-radius:16px;height:64px;font-size:20px}
</style></head><body>
<header><span id="title">Q-Arcade</span><span>⭐ <b id="score">0</b></span></header>
<main><canvas id="c" width="960" height="540"></canvas></main>
<div class="controls">
    <div class="dpad">
        <div><button id="u">▲</button></div>
        <div class="dpad-row"><button id="l">◀</button><button id="r">▶</button></div>
        <div><button id="d">▼</button></div>
    </div>
    <div><button id="a">A</button><button id="b">B</button></div>
</div>
<div id="start"><button id="go">🎮 Iniciar partida</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const parts=location.pathname.split('/'),game=parts.at(-1),token=new URLSearchParams(location.search).get('token')||'';
const names={pacman:'Pac-Man',mario:'Super Mario Bros.',doom:'DOOM',naves:'Naves',sunset:'Sunset Riders',carros:'Carros',circus:'Circus Charlie'};
document.getElementById('title').textContent=names[game]||'Q-Arcade';

let running=false,score=0,ended=false,left=false,right=false,up=false,down=false,btnA=false,btnB=false;
let p={x:480,y:420,vx:0,vy:0,w:40,h:40},objs=[],particles=[];

function bind(id,setter){
    let e=document.getElementById(id);
    ['pointerdown','pointerup','pointercancel','pointerleave'].forEach(k=>e.addEventListener(k,z=>{z.preventDefault();setter(k==='pointerdown')}));
}
bind('u',v=>up=v);bind('d',v=>down=v);bind('l',v=>left=v);bind('r',v=>right=v);
document.getElementById('a').onpointerdown=()=>btnA=true;
document.getElementById('a').onpointerup=()=>btnA=false;
document.getElementById('b').onpointerdown=()=>btnB=true;
document.getElementById('b').onpointerup=()=>btnB=false;

function initGame(){
    score=0;ended=false;p={x:480,y:420,vx:0,vy:0,w:40,h:40};objs=[];particles=[];
    if(game==='pacman'){
        for(let i=0;i<20;i++)objs.push({x:Math.random()*880+40,y:Math.random()*440+50,r:6,type:'dot'});
        for(let i=0;i<3;i++)objs.push({x:Math.random()*800+80,y:Math.random()*400+50,vx:(Math.random()-0.5)*150,vy:(Math.random()-0.5)*150,r:16,type:'ghost'});
    }else if(game==='mario'){
        p.y=400;for(let i=0;i<6;i++)objs.push({x:300+i*220,y:420,w:40,h:40,type:'block'});
        for(let i=0;i<3;i++)objs.push({x:500+i*350,y:360,w:30,h:30,type:'goomba'});
    }else if(game==='doom'){
        for(let i=0;i<5;i++)objs.push({x:Math.random()*800+80,y:Math.random()*380+60,hp:2,type:'enemy'});
    }else if(game==='naves'){
        p.y=460;for(let i=0;i<8;i++)objs.push({x:Math.random()*880+40,y:Math.random()*200+40,vx:100,type:'ship'});
    }else if(game==='sunset'){
        p.y=420;for(let i=0;i<4;i++)objs.push({x:Math.random()*700+100,y:350+Math.random()*60,state:'hidden',timer:Math.random()*2+1,type:'outlaw'});
    }else if(game==='carros'){
        p.x=480;p.y=420;for(let i=0;i<4;i++)objs.push({x:280+Math.random()*400,y:-i*150-50,vy:250+Math.random()*150,type:'car'});
    }else if(game==='circus'){
        p.y=420;for(let i=0;i<3;i++)objs.push({x:960+i*300,y:430,vx:-180,type:'hurdle'});
    }
}

function finish(){if(ended)return;ended=true;running=false;document.getElementById('go').textContent='Enviar puntuación';document.getElementById('start').style.display='grid';document.getElementById('go').onclick=submit}
async function submit(){if(!token){alert('Falta el token de lanzamiento.');return}let r=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,game,score})}),j=await r.json();if(!r.ok)return alert(j.detail||'Error');alert(j.new_record?'🏆 ¡Nuevo récord!':'Puntuación guardada')}

let last=0;
function loop(t){
    let dt=Math.min(.03,(t-last)/1000||0);last=t;
    if(running){
        if(game==='pacman'){
            p.vx=((right?1:0)-(left?1:0))*220; p.vy=((down?1:0)-(up?1:0))*220;
            p.x=Math.max(20,Math.min(940,p.x+p.vx*dt)); p.y=Math.max(20,Math.min(520,p.y+p.vy*dt));
            objs.forEach((o,i)=>{
                if(o.type==='dot'&&Math.hypot(o.x-p.x,o.y-p.y)<24){score+=50;objs.splice(i,1);}
                if(o.type==='ghost'){
                    o.x+=o.vx*dt; o.y+=o.vy*dt;
                    if(o.x<20||o.x>940)o.vx*=-1; if(o.y<20||o.y>520)o.vy*=-1;
                    if(Math.hypot(o.x-p.x,o.y-p.y)<22)finish();
                }
            });
            if(objs.filter(o=>o.type==='dot').length===0)score+=1000,finish();
        }
        else if(game==='mario'){
            p.vx=((right?1:0)-(left?1:0))*250; p.x=Math.max(20,Math.min(940,p.x+p.vx*dt));
            p.vy+=800*dt; p.y+=p.vy*dt;
            if(p.y>420){p.y=420;p.vy=0;if(up||btnA)p.vy=-480;}
            objs.forEach(o=>{
                if(o.type==='goomba'){
                    o.x-=60*dt; if(o.x<-50)o.x=1000;
                    if(Math.abs(o.x-p.x)<30&&Math.abs(o.y-p.y)<30){
                        if(p.vy>0){score+=200;o.y=700;p.vy=-250;}else{finish();}
                    }
                }
            });
            score+=Math.floor(dt*15);if(score>5000)finish();
        }
        else if(game==='doom'){
            p.vx=((right?1:0)-(left?1:0))*220; p.x=Math.max(30,Math.min(930,p.x+p.vx*dt));
            if(btnA&&Math.random()>0.4){
                btnA=false;
                objs.forEach(o=>{if(Math.abs(o.x-p.x)<80){o.hp--;if(o.hp<=0){o.x=Math.random()*800+80;o.y=Math.random()*380+60;o.hp=2;score+=300;}}});
            }
            objs.forEach(o=>{if(Math.hypot(o.x-p.x,o.y-p.y)<30)finish();});
            score+=Math.floor(dt*10);if(score>=4000)finish();
        }
        else if(game==='naves'){
            p.vx=((right?1:0)-(left?1:0))*320; p.vy=((down?1:0)-(up?1:0))*250;
            p.x=Math.max(30,Math.min(930,p.x+p.vx*dt)); p.y=Math.max(250,Math.min(500,p.y+p.vy*dt));
            if(btnA){btnA=false;particles.push({x:p.x,y:p.y-20,vy:-600});}
            particles.forEach((b,i)=>{b.y+=b.vy*dt;objs.forEach((o,j)=>{if(Math.hypot(o.x-b.x,o.y-b.y)<25){score+=150;o.y=-50;particles.splice(i,1);}});});
            objs.forEach(o=>{o.y+=50*dt;if(o.y>560)o.y=-40,o.x=Math.random()*880+40;if(Math.hypot(o.x-p.x,o.y-p.y)<30)finish();});
            particles=particles.filter(b=>b.y>-50);score+=Math.floor(dt*20);if(score>=6000)finish();
        }
        else if(game==='sunset'){
            p.x=Math.max(50,Math.min(910,p.x+((right?1:0)-(left?1:0))*200*dt));
            objs.forEach(o=>{
                o.timer-=dt;if(o.timer<=0){o.state=o.state==='hidden'?'shoot':'hidden';o.timer=Math.random()*2+1;}
                if(btnA&&o.state==='shoot'&&Math.abs(o.x-p.x)<100){score+=400;o.state='hidden';btnA=false;}
                if(o.state==='shoot'&&Math.random()<0.02)finish();
            });
            score+=Math.floor(dt*15);if(score>=4500)finish();
        }
        else if(game==='carros'){
            p.x+=((right?1:0)-(left?1:0))*350*dt; p.x=Math.max(300,Math.min(660,p.x));
            objs.forEach(o=>{
                o.y+=o.vy*dt;if(o.y>600)o.y=-120,o.x=300+Math.random()*360,score+=100;
                if(Math.abs(o.x-p.x)<35&&Math.abs(o.y-p.y)<60)finish();
            });
        }
        else if(game==='circus'){
            p.vx=((right?1:0)-(left?1:0))*200; p.x=Math.max(100,Math.min(860,p.x+p.vx*dt));
            p.vy+=900*dt; p.y+=p.vy*dt;
            if(p.y>420){p.y=420;p.vy=0;if(up||btnA)p.vy=-520;}
            objs.forEach(o=>{
                o.x+=o.vx*dt;if(o.x<-50)o.x=1000,score+=250;
                if(Math.abs(o.x-p.x)<30&&p.y>370)finish();
            });
            score+=Math.floor(dt*10);if(score>=5000)finish();
        }
        document.getElementById('score').textContent=score;
    }

    x.clearRect(0,0,960,540);
    x.fillStyle='#0f0f0f';x.fillRect(0,0,960,540);

    if(game==='pacman'){
        x.fillStyle='yellow';x.beginPath();x.arc(p.x,p.y,20,0,7);x.fill();
        objs.forEach(o=>{
            if(o.type==='dot'){x.fillStyle='#ffcc00';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();}
            if(o.type==='ghost'){x.fillStyle='#ff3366';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();}
        });
    }else if(game==='mario'){
        x.fillStyle='#e52521';x.fillRect(p.x-16,p.y-20,32,40);
        objs.forEach(o=>{
            if(o.type==='block'){x.fillStyle='#c84c0c';x.fillRect(o.x,o.y,o.w,o.h);}
            if(o.type==='goomba'){x.fillStyle='#853813';x.fillRect(o.x-15,o.y-15,30,30);}
        });
    }else if(game==='doom'){
        x.fillStyle='#44ff44';x.fillRect(p.x-15,p.y-20,30,40);
        objs.forEach(o=>{x.fillStyle='#cc2222';x.fillRect(o.x-20,o.y-25,40,50);});
    }else if(game==='naves'){
        x.fillStyle='#00ffcc';x.beginPath();x.moveTo(p.x,p.y-20);x.lineTo(p.x-20,p.y+20);x.lineTo(p.x+20,p.y+20);x.fill();
        particles.forEach(b=>{x.fillStyle='white';x.fillRect(b.x-3,b.y-8,6,16);});
        objs.forEach(o=>{x.fillStyle='#ff3333';x.fillRect(o.x-18,o.y-18,36,36);});
    }else if(game==='sunset'){
        x.fillStyle='#ffaa00';x.fillRect(p.x-15,p.y-25,30,50);
        objs.forEach(o=>{if(o.state==='shoot'){x.fillStyle='#ff0000';x.fillRect(o.x-15,o.y-25,30,50);}});
    }else if(game==='carros'){
        x.fillStyle='#3388ff';x.fillRect(p.x-20,p.y-35,40,70);
        objs.forEach(o=>{x.fillStyle='#ff3333';x.fillRect(o.x-20,o.y-35,40,70);});
    }else if(game==='circus'){
        x.fillStyle='#ff66cc';x.beginPath();x.arc(p.x,p.y-10,18,0,7);x.fill();
        objs.forEach(o=>{x.fillStyle='#ff8800';x.fillRect(o.x-15,o.y-30,30,60);});
    }

    requestAnimationFrame(loop);
}

document.getElementById('go').onclick=()=>{
    initGame();
    running=true;
    document.getElementById('start').style.display='none';
};
requestAnimationFrame(loop);
</script></body></html>
