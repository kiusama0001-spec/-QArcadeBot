<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Q-ArcadeBot - Clásicos Reales</title>
<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;background:#000;color:white;font-family:'Courier New',Courier,monospace;overflow:hidden}
header{height:46px;padding:8px 14px;display:flex;justify-content:space-between;font-weight:900;background:#111;border-bottom:2px solid #333;font-size:18px}
main{height:calc(100dvh - 46px);display:flex;align-items:center;justify-content:center;background:#000}
#game-container{width:100%;max-width:960px;aspect-ratio:4/3;max-height:calc(100dvh - 46px);background:#000}
</style>
</head>
<body>
<header><span id="title">Q-Arcade</span><span>🕹️ RETRO</span></header>
<main>
    <div id="game-container"></div>
</main>

<script>
const parts = location.pathname.split('/');
const game = parts.at(-1) || 'mario';

const titles = {
    pacman: 'Pac-Man (Original)',
    mario: 'Super Mario Bros. (NES)',
    doom: 'DOOM (Classic)',
    naves: 'Galaga / Space Invaders',
    sunset: 'Sunset Riders',
    carros: 'Spy Hunter',
    circus: 'Circus Charlie'
};
document.getElementById('title').textContent = titles[game] || 'Q-ARCADE';

// Configuración de EmulatorJS usando tus archivos locales subidos al repositorio
window.EJS_player = '#game-container';
window.EJS_core = (game === 'doom') ? 'doom' : 'nes';

// Apunta directamente al archivo ROM que subiste a tu repositorio
window.EJS_gameUrl = getLocalRomPath(game);

window.EJS_unmuteOnStart = true;
window.EJS_color = '#c84c0c';
window.EJS_startOnLoaded = true;
window.EJS_pathToData = 'https://cdn.emulatorjs.org/stable/data/';

function getLocalRomPath(g) {
    // Si subiste tus ROMs a una carpeta llamada 'roms':
    const localRoms = {
        mario: 'roms/smb.nes',
        pacman: 'roms/pacman.nes',
        circus: 'roms/circus.nes',
        naves: 'roms/galaga.nes',
        carros: 'roms/spyhunter.nes',
        sunset: 'roms/sunsetriders.nes',
        doom: 'roms/DOOM.WAD'
    };
    return localRoms[g] || localRoms['mario'];
}
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
