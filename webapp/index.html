<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Q-ArcadeBot</title>
<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;background:#000;color:white;font-family:'Courier New',Courier,monospace;overflow:hidden;display:flex;flex-direction:column;height:100dvh}
header{height:46px;padding:8px 14px;display:flex;justify-content:space-between;font-weight:900;background:#111;border-bottom:2px solid #333;font-size:18px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;position:relative}
canvas{width:100%;max-width:640px;aspect-ratio:4/3;background:#000;image-rendering:pixelated}
.pads{display:grid;grid-template-columns:repeat(3,60px);gap:10px;margin-top:15px}
button{background:#222;color:#fff;border:2px solid #555;font-weight:bold;border-radius:8px;font-size:16px;touch-action:manipulation}
.btn-action{display:flex;gap:20px;margin-top:10px}
.btn-action button{width:80px;height:45px;background:#c84c0c}
</style>
</head>
<body>
<header><span id="title">Q-Arcade</span><span>🕹️ NES</span></header>
<main>
    <canvas id="emscripten" width="256" height="240"></canvas>
    <div class="pads">
        <div></div><button ontouchstart="k(38,true)" ontouchend="k(38,false)">▲</button><div></div>
        <button ontouchstart="k(37,true)" ontouchend="k(37,false)">◀</button><div></div><button ontouchstart="k(39,true)" ontouchend="k(39,false)">▶</button>
        <div></div><button ontouchstart="k(40,true)" ontouchend="k(40,false)">▼</button><div></div>
    </div>
    <div class="btn-action">
        <button ontouchstart="k(65,true)" ontouchend="k(65,false)">A</button>
        <button ontouchstart="k(83,true)" ontouchend="k(83,false)">B</button>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.0/jsnes.min.js"></script>
<script>
const parts = location.pathname.split('/');
const game = parts.at(-1) || 'mario';

const roms = {
    mario: 'room/SuperMarioBros.nes',
    pacman: 'room/PacMan.nes',
    circus: 'room/CircusCharlie.nes',
    naves: 'room/Galaga.nes',
    carros: 'room/SpyHunter.nes'
};

document.getElementById('title').textContent = game.toUpperCase();

const canvas = document.getElementById('emscripten');
const ctx = canvas.getContext('2d');
const framebuffer = ctx.createImageData(256, 240);

let nes = new jsnes.NES({
    onFrame: function(data) {
        for (let i = 0; i < data.length; i++) {
            let pixel = data[i];
            framebuffer.data[i * 4] = (pixel & 0xFF0000) >> 16;
            framebuffer.data[i * 4 + 1] = (pixel & 0xFF00) >> 8;
            framebuffer.data[i * 4 + 2] = pixel & 0xFF;
            framebuffer.data[i * 4 + 3] = 0xFF;
        }
        ctx.putImageData(framebuffer, 0, 0);
    },
    onAudioSample: function(sample) {}
});

function k(code, down) {
    if (down) nes.buttonDown(1, code);
    else nes.buttonUp(1, code);
}

fetch(roms[game] || roms.mario)
    .then(res => res.arrayBuffer())
    .then(buffer => {
        let romData = new Uint8Array(buffer);
        nes.loadROM(String.fromCharCode.apply(null, romData));
        let interval = setInterval(() => { nes.frame(); }, 1000 / 60);
    })
    .catch(err => {
        alert("Error cargando la ROM: " + err);
    });
</script>
</body>
</html>
